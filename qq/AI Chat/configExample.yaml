# DeepSeek API 配置（复制本文件为 config.yaml 并填入真实值）
deepseek:
  base_url: https://api.deepseek.com
  api_key: sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  model: deepseek-v4-flash
  thinking:
    type: enabled
  reasoning_effort: medium
  max_tokens: 1024
  timeout_seconds: 60

# 高权限用户组：可无限次调用
admin_uins:
  - "123456789"          # 替换为真实 QQ 号

# 普通用户每日限额（北京时间 UTC+8）
rate_limit:
  daily_limit: 10
  utc_offset_hours: 8
